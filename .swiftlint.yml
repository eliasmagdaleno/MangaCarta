# SwiftLint configuration for MangaCarta.
# A linter config is this project's coding conventions, made machine-checkable.
# Rules that clash with deliberate style choices are relaxed here; rules that
# catch genuine bugs or sloppiness are kept.

# Only lint our own source — not build output or dependencies.
included:
  - MangaCarta
  - MangaCartaTests
  - MangaCartaUITests

# Rules turned off because they fight intentional, established style in this codebase:
disabled_rules:
  - identifier_name              # short local names (p, l, r, c, id) are used on purpose
  - trailing_comma               # multiline literals keep trailing commas (cleaner diffs)
  - implicit_optional_initialization  # explicit `= nil` is used deliberately in places
  - non_optional_string_data_conversion  # existing String(data:encoding:) usage; revisit later
  - todo                         # don't fail CI on TODO/FIXME comments

# Relax length limits: SwiftUI view bodies and descriptive lines run long here.
line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

# Size rules are warning-only: they nudge (e.g. the large test file is a real
# split candidate) but never fail CI — file size isn't a bug.
file_length:
  warning: 2200

type_body_length:
  warning: 1800

function_body_length:
  warning: 120
  error: 250

large_tuple:
  warning: 3
  error: 4

# Project-specific checks for bugs that tests missed.
custom_rules:
  # A string literal containing `(camelCase)` or `(a.b)` is almost always an interpolation
  # missing its backslash — "x-(storageID)" instead of "x-\(storageID)". It compiles and the
  # tests stay green, so it slipped past review twice on 2026-09-24 (#236 shared UI-test
  # storage across runs; #242 collapsed every per-site rate limiter into one global key).
  # Parentheses right after an identifier (a call like `fmt(r.days)`) are not flagged.
  missing_interpolation_backslash:
    name: "Missing interpolation backslash"
    regex: '(?<![\\\w])\((?=[^)]*[A-Z.])[a-z_]\w*(?:\.[A-Za-z_]\w*)*\)'
    match_kinds:
      - string
    message: "Looks like a string interpolation missing its backslash: write \\(name), not (name)."
    severity: error
